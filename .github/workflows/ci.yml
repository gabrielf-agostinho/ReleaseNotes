name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore ReleaseNotes.slnx

      - name: Check formatting and code style
        run: dotnet format ReleaseNotes.slnx --verify-no-changes --no-restore

      - name: Build (Release, warnings as errors)
        run: dotnet build ReleaseNotes.slnx --configuration Release --no-restore

      # NuGet audit runs during restore and fails the build on known vulnerable packages.
      - name: Report vulnerable packages (informational, see Limitations in the README)
        run: dotnet list ReleaseNotes.slnx package --vulnerable --include-transitive

      - name: Test
        run: >
          dotnet test ReleaseNotes.slnx --configuration Release --no-build
          --logger "trx;LogFilePrefix=results" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: build-and-test
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build --tag releasenotes-cms:ci .

      - name: Smoke test the container
        run: |
          docker run --detach --name releasenotes -p 8080:8080 \
            -e ConnectionStrings__umbracoDbDSN="Data Source=/app/umbraco/Data/Umbraco.sqlite.db;Cache=Shared;Foreign Keys=True;Pooling=True" \
            -e ConnectionStrings__umbracoDbDSN_ProviderName=Microsoft.Data.Sqlite \
            -e Umbraco__CMS__Unattended__InstallUnattended=true \
            -e Umbraco__CMS__Unattended__UnattendedUserName=CI \
            -e Umbraco__CMS__Unattended__UnattendedUserEmail=ci@example.com \
            -e Umbraco__CMS__Unattended__UnattendedUserPassword="ci-$(openssl rand -hex 16)" \
            -e Umbraco__CMS__Imaging__HMACSecretKey="$(openssl rand -base64 64 | tr -d '\n')" \
            -e Umbraco__CMS__Global__UseHttps=false \
            -e ReleaseNotes__DemoContent__Enabled=true \
            releasenotes-cms:ci
          for attempt in $(seq 1 60); do
            if curl --silent --fail http://localhost:8080/api/v1/products/forgekit/releases/latest > latest.json; then
              grep -q '"version":"1.4.0"' latest.json && curl --silent --fail --output /dev/null http://localhost:8080/products/forgekit/1-4-0/ && echo "Container is serving content" && exit 0
            fi
            sleep 2
          done
          docker logs releasenotes
          exit 1

      - name: Container logs
        if: failure()
        run: docker logs releasenotes || true
